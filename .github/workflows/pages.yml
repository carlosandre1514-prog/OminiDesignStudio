name: Publicar no GitHub Pages

on:
  push:
    branches: [ccr-3d9feebc-esrcqe]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # O app é servido em https://<usuário>.github.io/<repositório>/
      BASE_PATH: /${{ github.event.repository.name }}/
      # Configuração pública do Supabase (URL do projeto + chave publishable).
      # A segurança vem das regras RLS do banco; nunca coloque aqui a chave secreta.
      VITE_SUPABASE_URL: https://pxtxcbqqbjtmsmwbcise.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_URNeHmQn-EuIyqXbkbMSag_gWTtX2rf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build:pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
